name: Publish to NPM

on:
  release:
    types: [created] # Triggers when a new GitHub Release is created

jobs:
  wait-for-tests:
    name: Wait for tests to complete
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check test workflow status
        uses: actions/github-script@v6
        with:
          script: |
            const conclusion = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'test.yml',
              branch: 'main', // Assuming tests run on the main branch
              event: 'push', // Assuming tests run on push to main
              status: 'success',
            });
            if (conclusion.data.workflow_runs.length === 0) {
              core.setFailed('No successful test runs found on main branch.');
            }

  publish-npm:
    needs: wait-for-tests
    name: Publish package to NPM
    runs-on: ubuntu-latest
    permissions:
      contents: read # Needed to checkout the repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Or a newer version

      - name: Set up Node.js
        uses: actions/setup-node@v4 # Or a newer version
        with:
          node-version: '22' # Or your preferred LTS Node.js version
          registry-url: 'https://registry.npmjs.org/' # Sets up .npmrc for publishing

      - name: Install dependencies
        run: npm ci # 'ci' is generally preferred over 'install' in CI environments

      # Build step for TypeScript transpilation
      - name: Build project
        run: npm run build

      # Optional: Add a test step here
      # - name: Run tests
      #   run: npm test

      - name: Publish to NPM
        run: npm publish --access public # '--access public' is needed for scoped public packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}